[package]
name = "wupi-updater"
version = "0.28.5"
edition = "2021"
# Kept in lockstep with src-tauri/Cargo.toml + tauri.conf.json by release.cjs's
# version-sync step. The updater's own version is not user-facing (wupi.exe's
# package_info().version is the single source of truth the UI surfaces).
description = "Headless temp-staged updater for WUPI. Runs out of %TEMP% after wupi.exe exits, overwrites the install in place (all locks released), then relaunches wupi.exe."

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
# Pure-Rust zip extraction — extracts the update payload. No system deps.
# Version aligned with src-tauri's `zip = "2"`.
zip = "2"
# CRC32 for the extract-time byte-identity skip (stage.rs: a live file whose
# size + CRC32 match a zip entry is already the payload's content and is
# neither staged nor copied). Same crate zip itself hashes with — already in
# the lockfile via zip, so this adds no new graph edges.
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
# Win32 process wait: OpenProcess + WaitForSingleObject to block until the
# spawning wupi.exe has fully exited + released its OS file locks (so the
# overwrite of wupi.exe + bin/*.dll succeeds). Official Microsoft crate,
# version aligned with src-tauri's. Feature-gated to the APIs we touch:
# Threading for the parent wait, ToolHelp for the relaunch ladder's takeover
# attribution (main.rs any_wupi_process_alive — a vanished result marker is
# attributed to the USER only when a wupi.exe/fable.exe is actually alive;
# otherwise it was our own deceased child and the ladder retries).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# Temp dirs for the extract+copy integration test.
tempfile = "3"
