[package]
name = "wupi-updater"
version = "0.24.0"
edition = "2021"
# Kept in lockstep with src-tauri/Cargo.toml + tauri.conf.json by release.cjs's
# version-sync step. The updater's own version is not user-facing (wupi.exe's
# package_info().version is the single source of truth the UI surfaces).
description = "Headless temp-staged updater for WUPI. Runs out of %TEMP% after wupi.exe exits, overwrites the install in place (all locks released), then relaunches wupi.exe."

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
# Pure-Rust zip extraction — extracts the update payload. No system deps.
# Version aligned with src-tauri's `zip = "2"`.
zip = "2"
# Serialize the result marker written for the relaunched wupi.exe to read on
# next boot (`<install>/data/_update_result.json`).
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Win32 process wait: OpenProcess + WaitForSingleObject to block until the
# spawning wupi.exe has fully exited + released its OS file locks (so the
# overwrite of wupi.exe + bin/*.dll succeeds). Official Microsoft crate,
# version aligned with src-tauri's. Feature-gated to the two APIs we touch.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Temp dirs for the extract+copy integration test.
tempfile = "3"
