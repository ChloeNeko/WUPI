[package]
name = "wupi"
version = "0.32.2"
edition = "2021"
# Two [[bin]] targets exist (wupi + fable). default-run picks wupi.exe as the
# primary for `cargo run` / `tauri dev` — without it, multiple bins + no
# default-run makes `cargo run` error ("requires choosing a binary"). `cargo
# build` still builds BOTH bins regardless.
default-run = "wupi"

[lib]
name = "wupi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Two launcher binaries share the wupi_lib boot code (model load, memory DB,
# tray, IPCs). Listing them explicitly disables bin auto-discovery so exactly
# these two build: `wupi.exe` (normal OS boot) + `fable.exe` (sets the
# fable-entry flag → main window loads `wupi.html#fable` → skips straight to
# the Fable title). `npx tauri build` emits both into target/release/.
# NOTE (2026-08-14, Chloe's call): the exe name stays `fable.exe` even though
# Discord's game detection matches it to the 2005 "Fable: The Lost Chapters"
# (that game's exe is literally Fable.exe). Do NOT rename to dodge Discord.
[[bin]]
name = "wupi"
path = "src/main.rs"

[[bin]]
name = "fable"
path = "src/bin/fable.rs"

# Standalone SD repro harness (§11.59): loads one checkpoint DIRECTLY via
# DiffusionRsGenerator — no Tauri, no LLM, no swap cycle — and writes a
# single PNG. The isolation tool for debugging sd.cpp load/generate
# failures (e.g. the single-file image.safetensors path): run in a real
# TTY, the ggml abort text is visible inline (stderr is line-buffered) +
# install_sd_abort_callback captures it to <exe_dir>/logs/sd-abort.txt.
# `required-features` keeps it out of default builds entirely — it exists
# only for the real backend, so `npm run sd:check`-style invocations build
# it while plain dev/release builds never see it.
[[bin]]
name = "sd_repro"
path = "src/bin/sd_repro.rs"
required-features = ["diffusion-rs"]

[features]
# Phase 5B: local Stable Diffusion scene-image generation (wraps
# leejet/stable-diffusion.cpp via newfla/diffusion-rs). OFF by default — the
# NoopImageGenerator stub compiles instantly + exercises the full swap
# pipeline; enabling this with `--features diffusion-rs` pulls in the
# diffusion-rs optional dep + its ~20-40 min one-time CUDA compile. Chloe's
# build-safety procedure (docs/phase5b-diffusion-rs-cargo-procedure.md) owns
# the isolated build + the risk flags to watch. The scene_art.rs
# `#[cfg(feature = "diffusion-rs")]` impl + `default_sd_backend()` dispatch
# are already wired; without this feature the stub path compiles in seconds.
default = []
# `diffusion-rs-sys` is gated together with the high-level wrapper so a bare
# `diffusion-rs = ["dep:diffusion-rs"]` pulls BOTH. We need `-sys` directly to
# reach `ggml_set_abort_callback` — the symbol that lets us capture the
# `GGML_ASSERT`/`GGML_ABORT` text inside gen_img BEFORE the uncatchable
# `abort()` fires (§11.59). The high-level `diffusion-rs` crate does NOT
# re-export `-sys`, and llama-cpp-sys's ggml is a SEPARATE statically-linked
# copy (SD vendors its own ggml), so the callback MUST come from this crate.
# See lib.rs::install_sd_abort_callback for the registration + rationale.
diffusion-rs = ["dep:diffusion-rs", "dep:diffusion-rs-sys"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Used by build.rs to locate rc.exe (the MSVC resource compiler) via the same
# VS-toolchain lookup tauri-winres uses, so the F-icon resource is compiled +
# linked into fable.exe only. Already a transitive dep (via tauri-build →
# tauri-winres → cc); adding it directly just exposes the API to build.rs.
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
# Native OS file-open dialog for the card-import folder-picker fallback
# (Slice D of the "Create vs Import" flow, 2026-07-29). The drag-drop path is
# primary; this is the guaranteed-working fallback for users who prefer a
# picker. Read-only usage (the import IPC reads the picked path server-side).
tauri-plugin-dialog = "2"
# Single-instance lock: launching wupi.exe a second time focuses the existing
# window (show + set_focus via system_menu::power_wake) instead of booting a
# duplicate (which would re-run all of setup(), re-load the 9.8 GB model, and
# create a second tray paw). Uses a per-app named mutex on Windows. The
# restart path opts out via the WUPI_RESTART_SPAWN env sentinel (see
# system_menu::power_restart + the gate in lib.rs run()) so the freshly-spawned
# child isn't seen as a "second instance" while the parent is still shutting
# down.
tauri-plugin-single-instance = "2"
# NOTE: tauri-plugin-updater + tauri-plugin-process were removed when WUPI
# switched to portable distribution. Tauri's updater is installer-only and
# can't update a portable exe; a custom file-level updater (src/updater.rs)
# replaces it. Relaunch-on-update uses Tauri's built-in `app.restart()`
# (core API, no plugin needed).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for the updater's post-download integrity gate over the portable
# zip (2026-08-20). Already transitive in the lockfile — the direct dep adds
# no new packages to the graph (same precedent as chrono below).
sha2 = "0.10"
# Async runtime for the agent loop + streaming.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Typed errors without boilerplate.
anyhow = "1"
# HTTP client for the API chat backend (OpenAI-compatible SSE streaming).
# rustls-tls avoids any system OpenSSL dependency on Windows; the `stream`
# feature is required to read the Server-Sent Events response incrementally
# (token-by-token, same streaming UX as the local model).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# futures-util for StreamExt — needed to iterate the reqwest SSE byte stream.
futures-util = "0.3"
# Regex for the StreamFilter's combined marker-stripping pattern.
regex = "1"
# Logging — written to a file in app data; visible only in Debug mode.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Local-time timestamps + crash-report-style rotation filenames for the
# share-safe diagnostic log (diaglog.rs). Already transitive via tauri —
# direct dep adds no new packages to the graph.
chrono = "0.4"
# GPU backends (local inference for the 12B chat model). Both are compiled
# in: llama.cpp tries CUDA first (NVIDIA), falls through to Vulkan (AMD /
# Intel) if CUDA init fails, then to CPU. This is ADDITIVE — `cuda` and
# `vulkan` coexist in one exe. CPU-only inference collapses ~32-42 tok/s
# to single digits, so do NOT remove either backend.
#
# Runtime selection (no custom code):
#   - NVIDIA + CUDA DLLs present → CUDA path (~32-42 tok/s)
#   - AMD / Intel → Vulkan path via driver-bundled vulkan-1.dll (~25 tok/s)
#   - No GPU → CPU fallback
#
# Vulkan's runtime loader (`vulkan-1.dll`) ships with the GPU DRIVER, not
# the app — so no Vulkan DLLs need to be staged in WUPI.zip. AMD users get
# Vulkan from their Adrenalin driver; NVIDIA from theirs. The VULKAN_SDK
# env var in .cargo/config.toml is only needed at BUILD time (for
# vulkan-1.lib + glslangValidator during CMake).
#
# See AGENTS.md §0 (stack), §2 (deps), §11.14 (AMD support).
llama-cpp-2 = { version = "0.1.151", features = ["sampler", "cuda", "vulkan"] }
# Phase 5B: local Stable Diffusion (wraps leejet/stable-diffusion.cpp). OFF
# by default (see [features] above); enabled only with --features diffusion-rs.
# Same toolchain shape as llama-cpp-2 (Ninja + CUDA_PATH + VULKAN_SDK from
# .cargo/config.toml); vendors its OWN ggml (no symbol collision with llama's).
# NOTE: it reads CUDA_COMPUTE_CAP (NOT LLAMA_CMAKE_CUDA_ARCHITECTURES) for its
# CUDA arch target — set in .cargo/config.toml. The ~20-40 min CUDA compile is
# isolated by Chloe's build-safety procedure (watch for a /DELAYLOAD:cublas64_13
# linker interaction — see docs/phase5b-diffusion-rs-cargo-procedure.md).
diffusion-rs = { version = "0.1.20", optional = true, features = ["cuda", "vulkan"] }
# Direct dep on the -sys crate (the FFI bindings) so WUPI can call
# `ggml_set_abort_callback` — the high-level `diffusion-rs` wrapper does not
# re-export it. The version + features MUST match the high-level crate's
# transitive `-sys` (Cargo unifies them — same source, single CUDA compile).
diffusion-rs-sys = { version = "0.1.20", optional = true, features = ["cuda", "vulkan"] }
encoding_rs = "0.8"
# Memory engine (Phase 2). `bundled` compiles SQLite from the amalgamation →
# FTS5 is guaranteed available on Windows without a system SQLite install.
# No `load_extension` feature — sqlite-vec is registered via the
# `sqlite3_auto_extension` FFI at startup (see memory.rs::ensure_vec_loaded).
rusqlite = { version = "0.31", features = ["bundled"] }
# sqlite-vec virtual table for dense vector (cosine) search. v0.1.9 is the
# latest 0.1.x (2025-07). Embeds the C source, compiled via the `cc` crate.
sqlite-vec = "0.1.9"
# Simulation Card (.sim) loader — small structured persona files. roxmltree is
# a tiny DOM parser that auto-merges CDATA into text nodes, so the emoticons
# and quotes in card prose parse with zero special handling. Purpose-built for
# read-once-at-startup config files; no streaming overhead.
roxmltree = "0.10"
# Randomized startup introduction selection (one pick per boot from the active
# card's <introductions> list). The canonical RNG; not otherwise in the tree.
rand = "0.9"
# Zip extraction for the portable self-updater. Pure-Rust, no system deps.
# The updater downloads a portable.zip from the GitHub release and extracts it
# in place, skipping the `data/` dir (user state). See src/updater.rs.
zip = "2"
# Windows API bindings — official Microsoft crate (Win32 + WinRT). Used for
# the hardware integrations: Core Audio (volume + output switching), WLAN
# (Wi-Fi scan/connect), and Bluetooth (radio + device enumeration). Feature
# gates are additive per phase so unused API surface isn't compiled in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem",
    # IShellLinkW + IPersistFile (Windows .lnk shortcut generation, shortcut.rs)
    # + SHGetKnownFolderPath (desktop-dir resolution). The COM init/creation
    # surface under Win32_System_Com is already enabled above.
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Variant",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation_Collections",
] }
# Direct dep so the windows::core::interface macro can resolve windows_core
# (the macro expands to paths through the windows_core crate root).
windows-core = "0.58"

[dev-dependencies]
# Temp dirs for unit tests (game_save, etc.). Dev-only — not shipped in the exe.
tempfile = "3"

# ===========================================================================
# §11.59 Bug B fix: vendored diffusion-rs-sys (GGUF architecture detection).
# ===========================================================================
# A ComfyUI-convention Q8 GGUF UNet stores ONLY diffusion-model tensors under
# bare input_blocks.* names. sd.cpp's tensor-name-based version detection is a
# CIRCULAR dependency for this layout (is_unet ← get_sd_version ← needs a CLIP
# token_embedding that loads after the version check). The vendored copy at
# vendor/diffusion-rs-sys patches model_loader.cpp to read the GGUF's
# `general.architecture` metadata (="sdxl") and preset version_ BEFORE the
# tensor scan, breaking the circle. build.rs is UNCHANGED (still Release —
# matches llama-cpp-sys, so no LNK2038 RuntimeLibrary mismatch). Only the C++
# source differs; the Rust + build.rs are unmodified 0.1.20. Requires the
# ~20-40 min CUDA recompile on first build (Chloe runs it).
[patch.crates-io]
diffusion-rs-sys = { path = "vendor/diffusion-rs-sys" }
# ===========================================================================
# §11.59 dual-CRT fix (2026-08-16): vendored llama-cpp-sys-2 (no msvcrtd).
# ===========================================================================
# Upstream 0.1.151's build.rs emits `cargo:rustc-link-lib=dylib=msvcrtd`
# under cfg!(debug_assertions) — and cargo compiles build scripts with
# debug-assertions ON in dev, so every dev exe linked BOTH msvcrt.lib and
# msvcrtd.lib (proven via the PDB's lib list). The /MD-compiled native code
# then split its stdio across ucrtbase.dll and ucrtbased.dll, and FILE*/fd
# crossings between the two killed SD generation with UCRT debug asserts
# (`_osfile(fh) & FOPEN` in _read; the fprintf stream-validation assert) —
# both exit 0x80000003, right AFTER the first render's PNG landed.
#
# The vendored copy is byte-identical 0.1.151 EXCEPT that one block is
# removed (see vendor-patches/llama-cpp-sys-2/ for the .patch + the restore
# script). This is the "narrower mechanism" the old
# [profile.dev.build-override] attempt needed: that override is NOT viable
# (tauri-build's ACL manifest loses `referenced_by` at build-script DA=OFF
# while generate_context! at DA=ON requires it → E0063), and
# /NODEFAULTLIB:msvcrtd does not suppress rustc's explicit `-l dylib=`
# linker input. Note: patching this crate re-fingerprints ITS build script
# only → one full llama CUDA rebuild fires on the next sd:check/sd:dev
# (the SD stack itself is untouched). Release builds were never affected
# (the emission is debug-only).
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }

# ===========================================================================
# §11.59 dual-CRT fix, attempt 1 (2026-08-15) — DISABLED, superseded by the
# vendored llama-cpp-sys-2 patch above. Kept as a tombstone: do NOT re-enable.
# ===========================================================================
# [profile.dev.build-override] turned build-script debug-assertions OFF, which
# removes msvcrtd from the link line — but tauri-build is ALSO a build script,
# and its ACL manifest serialization of `ResolvedCommand`'s `referenced_by` is
# #[cfg(debug_assertions)]-gated (tauri-utils acl/resolved.rs). With build
# scripts at debug-assertions=OFF, the manifest is written WITHOUT that field,
# but `tauri::generate_context!` (compiled into the lib, debug-assertions ON)
# must initialize the struct that HAS it → E0063 "missing field
# `referenced_by`" at the generate_context! call — `cargo check`,
# `cargo tauri dev`, and `npm run sd:dev` all fail. The vendored sys-crate
# patch achieves the same single-CRT dev link without touching profiles.
# [profile.dev.build-override]
# debug-assertions = false
