[env]
LLAMA_CMAKE_CUDA_ARCHITECTURES = "120"
# Phase 5B: diffusion-rs (stable-diffusion.cpp) reads THIS var for its CUDA
# arch target — NOT LLAMA_CMAKE_CUDA_ARCHITECTURES. Same value (12.0 = "120")
# as llama's so both kernels target the same GPU. See
# docs/phase5b-diffusion-rs-cargo-procedure.md.
CUDA_COMPUTE_CAP = "120"
LIBCLANG_PATH = "C:\\Program Files\\LLVM\\bin"
CUDA_PATH = "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.3"
CudaToolkitDir = "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.3"
CMAKE_BUILD_PARALLEL_LEVEL = "24"
# Vulkan SDK — required at BUILD time only (llama-cpp-sys-2 build.rs line ~860
# reads this to find vulkan-1.lib + glslangValidator for CMake). The runtime
# vulkan-1.dll loader ships with the GPU DRIVER, NOT this SDK — so this path
# is never needed on a user machine, only on the dev box.
VULKAN_SDK = "C:\\VulkanSDK\\1.4.350.0"
# Build generator — Ninja instead of Visual Studio. The VS generator (the
# cmake-rs default on Windows) has a parallel-build race in CMake's
# ExternalProject_Add step: it ran vulkan-shaders-gen's install step before
# configure finished writing cmake_install.cmake → "Not a file" → MSB8066 /
# "system cannot find the batch label specified - VCEnd". Ninja serializes
# ExternalProject steps correctly AND is materially faster for the
# non-CUDA cmake targets (host tool compiles, ggml-cpu cxx, etc.). Ninja
# itself is single-instance; CMAKE_BUILD_PARALLEL_LEVEL controls the
# compile pool size. Requires ninja.exe on PATH at build time (chocolatey:
# `choco install ninja`). See AGENTS.md §11.14.
CMAKE_GENERATOR = "Ninja"

# Delay-load 3 of the 4 PE static-import DLLs so they don't have to live at
# the exe's own directory at process start (AGENTS.md §8B bin/ layout).
#
# Background: the MSVC linker records imports two ways:
#   1. STATIC imports — resolved by the loader at process start from the exe's
#      directory + System32 + PATH. If missing → "cublas64_13.dll was not
#      found" on launch.
#   2. RUNTIME imports — LoadLibrary at first use. The app controls where it
#      searches; we hook that via SetDllDirectoryW in main.rs.
#
# `cublas64_13`, `cudart64_13`, `vcomp140` are static imports but compile
# with /DELAYLOAD, which flips them into the lazy-resolution model: the
# loader inserts a stub that calls LoadLibrary on first symbol reference,
# at which point SetDllDirectoryW has pointed the search at `bin/`.
#
# `delayimp.lib` provides the delay-load helper that the stubs call into.
# Without it the linker errors on `/DELAYLOAD`.
#
# The rest of the CUDA DLLs (cublasLt, nvJitLink, nvrtc*, nvfatbin, cufft) are
# LoadLibrary'd by ggml-cuda at first GPU op → they're category 2 already, no
# delay-load needed.
#
# `msvcp140.dll` is the EXCEPTION: it stays a static import at the install
# root. /DELAYLOAD only works for FUNCTION imports; msvcp140 exports data
# symbols (e.g. `std::locale::id::_Id_cnt`) that the static CRT references
# directly. MSVC errors out: "LNK1194: cannot delay-load 'MSVCP140.dll' due
# to import of data symbol". So msvcp140.dll MUST live at the install root
# (release.cjs copies it there, not to bin/). This is the one loose DLL at
# the root in the v0.3.7 bin/ layout.
#
# v0.23.1: `stable-diffusion.dll` joins the delay-load set (the v0.23.0
# launch-crash fix). The diffusion-rs feature statically imports it in BOTH
# exes, and its own dependency chain (ggml{,-base,-cpu,-cuda,-vulkan}.dll →
# cublas64_13.dll) resolved at process start — before SetDllDirectoryW —
# which is why v0.23.0 couldn't launch without root copies. Delay-loaded,
# the whole chain resolves at the first SD symbol call (well after boot)
# through `bin/`, where release.cjs stages the SD DLLs and cublas64_13
# already lives. sd.cpp's C API is pure functions (sd_* + callbacks), so
# the LNK1194 data-symbol failure mode doesn't apply; if a future -sys
# upgrade drags a data import in, the link fails LOUDLY with LNK1194 —
# do NOT then move the DLL to the root; fix the binding.
#
# !! FROZEN (Chloe ruling, 2026-08-18): the AGENT never edits this file —
# not the flags, not [env], nothing. ANY change here re-fingerprints EVERY
# build script → full CUDA recompile of llama-cpp-sys-2 + diffusion-rs-sys
# (~20-40 min, EVERY time, NOT a one-time cost). `npm run release` must
# NEVER rebuild the CUDA cores; if a link change is ever needed, Chloe
# decides and Chloe executes it herself. The 2026-08-18 incident: an agent
# added the delay-load line below with this warning stripped and Chloe's
# routine release paid the CUDA cost blind. Never again.
[build]
rustflags = [
    "-C", "link-args=/DELAYLOAD:cublas64_13.dll",
    "-C", "link-args=/DELAYLOAD:cudart64_13.dll",
    "-C", "link-args=/DELAYLOAD:vcomp140.dll",
    "-C", "link-args=/DELAYLOAD:stable-diffusion.dll",
    "-C", "link-args=delayimp.lib",
]
